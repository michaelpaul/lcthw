name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./liblcthw
    steps:
    - uses: actions/checkout@v4
    - run: make dev
    - run: make check
    - run: sudo make install
